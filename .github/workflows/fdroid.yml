name: F-Droid preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ACardEmulator/**
      - fdroid/**
      - tools/check_fdroid_apk.py
      - .github/workflows/fdroid.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build without bundled Samsung libraries
        run: |
          rm -rf ACardEmulator/app/libs
          ./ACardEmulator/gradlew -p ACardEmulator --no-daemon testFdroidReleaseUnitTest assembleFdroidRelease
      - name: Check the actual release APK
        run: |
          python3 tools/check_fdroid_apk.py \
            ACardEmulator/app/build/outputs/apk/fdroid/release/*-unsigned.apk \
            "$ANDROID_HOME/build-tools/34.0.0/aapt2"
